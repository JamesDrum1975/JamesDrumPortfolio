<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            max-width: 1200px;
            max-height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <video controls playsinline preload="metadata">
        <source src="Have-A-Great-Day.mp4" type="video/mp4">
        Your browser does not support video playback.
    </video>
</body>
</html>
